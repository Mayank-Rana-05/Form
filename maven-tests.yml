name: FormTest Pro Java Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  selenium-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run Selenium and TestNG suite (headless Chrome)
        run: mvn --batch-mode clean test -Dbrowser=chrome -Dheadless=true
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formtestpro-test-reports
          path: target/surefire-reports/
          if-no-files-found: warn
